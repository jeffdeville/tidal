min_version: 1.11.1

pre-commit:
  parallel: true
  commands:
    compile:
      run: mix compile --warnings-as-errors
    format:
      glob: "*.{ex,exs,heex}"
      run: mix format {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    compile:
      run: mix compile --warnings-as-errors
    format-check:
      run: mix format --check-formatted
    credo:
      run: mix credo --min-priority=high
